name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  version-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      PLUGIN_JSON: session-archiver/.claude-plugin/plugin.json
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require version bump unless docs-only change
        run: |
          git fetch origin main
          if [ "$(git rev-list --count origin/main..HEAD)" -eq 0 ]; then
            echo "No new commits vs main."
            exit 1
          fi

          changed=$(git diff --name-only origin/main...HEAD)
          shippable=$(echo "$changed" | grep -vE '\.md$|^\.github/|^ruff\.toml$' || true)
          if [ -z "$shippable" ]; then
            echo "No shippable files changed (docs/CI/tooling only), version bump not required."
            exit 0
          fi

          old_version=$(git show origin/main:"$PLUGIN_JSON" | jq -r .version)
          new_version=$(jq -r .version "$PLUGIN_JSON")
          if [ "$old_version" = "$new_version" ]; then
            echo "plugin.json version unchanged ($new_version) but non-docs files changed. Bump the version."
            exit 1
          fi
          echo "Version bumped: $old_version -> $new_version"

  lint:
    needs: version-check
    if: always() && needs.version-check.result != 'failure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - run: pip install ruff
      - run: ruff check .

  secret-scan:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  unit-tests:
    needs: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - run: pip install pytest
      - run: pytest
